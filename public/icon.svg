<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Gold Metallic Gradients -->
    <linearGradient id="shieldGoldRim" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#FFF4B8" />
      <stop offset="25%" stop-color="#F5D061" />
      <stop offset="50%" stop-color="#D4A237" />
      <stop offset="75%" stop-color="#8C6218" />
      <stop offset="100%" stop-color="#FAD872" />
    </linearGradient>

    <linearGradient id="innerShieldGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF0AA" />
      <stop offset="50%" stop-color="#D4A237" />
      <stop offset="100%" stop-color="#7A5212" />
    </linearGradient>

    <linearGradient id="carBodyGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF6C2" />
      <stop offset="25%" stop-color="#F5CF60" />
      <stop offset="65%" stop-color="#D4A237" />
      <stop offset="100%" stop-color="#9C6E1D" />
    </linearGradient>

    <linearGradient id="shieldDarkBg" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#141E2F" />
      <stop offset="40%" stop-color="#0E1624" />
      <stop offset="100%" stop-color="#05080E" />
    </linearGradient>

    <linearGradient id="goldTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F5CF60" />
      <stop offset="35%" stop-color="#FFF6C2" />
      <stop offset="70%" stop-color="#E5BA45" />
      <stop offset="100%" stop-color="#C99427" />
    </linearGradient>

    <radialGradient id="badgeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D4A237" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#05080E" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="beaconGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF4D4D" stop-opacity="1" />
      <stop offset="45%" stop-color="#E11D48" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#E11D48" stop-opacity="0" />
    </radialGradient>

    <filter id="goldDropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.85"/>
    </filter>

    <filter id="headlightGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base Canvas -->
  <rect width="512" height="512" fill="#05080E" rx="90" />

  <!-- Ambient Glow Behind Shield -->
  <circle cx="256" cy="235" r="215" fill="url(#badgeGlow)" />

  <!-- Outer Shadowed Shield Border -->
  <path d="M 256 38 
           C 338 38, 418 60, 436 122 
           C 444 246, 378 364, 256 446 
           C 134 364, 68 246, 76 122 
           C 94 60, 174 38, 256 38 Z"
        fill="url(#shieldDarkBg)"
        stroke="url(#shieldGoldRim)"
        stroke-width="14"
        stroke-linejoin="round"
        filter="url(#goldDropShadow)" />

  <!-- Secondary Inner Fine Gold Shield Outline -->
  <path d="M 256 56 
           C 328 56, 398 76, 414 128 
           C 420 234, 362 338, 256 414 
           C 150 338, 92 234, 98 128 
           C 114 76, 184 56, 256 56 Z"
        fill="none"
        stroke="url(#innerShieldGold)"
        stroke-width="3.5"
        opacity="0.85" />

  <!-- Vertical Road Centerline (Above Car) -->
  <line x1="256" y1="74" x2="256" y2="182"
        stroke="#F59E0B"
        stroke-width="8"
        stroke-dasharray="18 16"
        stroke-linecap="round" />

  <!-- Vertical Road Centerline (Below Car) -->
  <line x1="256" y1="324" x2="256" y2="394"
        stroke="#F59E0B"
        stroke-width="8"
        stroke-dasharray="18 16"
        stroke-linecap="round" />

  <!-- Sleek Front-Facing Patrol Vehicle Emblem -->
  <g id="car-emblem" filter="url(#goldDropShadow)">
    <!-- Mirrors -->
    <rect x="174" y="222" width="14" height="10" rx="5" fill="url(#carBodyGold)" />
    <rect x="324" y="222" width="14" height="10" rx="5" fill="url(#carBodyGold)" />

    <!-- Roof & Cabin -->
    <path d="M 218 216 
             L 228 184 
             C 231 180, 237 178, 243 178 
             L 269 178 
             C 275 178, 281 180, 284 184 
             L 294 216 Z"
          fill="url(#carBodyGold)" />

    <!-- Windshield Inset -->
    <path d="M 222 214 
             L 231 187 
             C 234 184, 237 183, 243 183 
             L 269 183 
             C 275 183, 278 184, 281 187 
             L 290 214 Z"
          fill="#080D16" />

    <!-- Reflection -->
    <polygon points="233,187 245,187 237,211 226,211" fill="#FFFFFF" opacity="0.2" />

    <!-- Main Car Body & Hood -->
    <path d="M 188 216 
             L 324 216 
             C 338 216, 346 224, 346 238 
             L 346 274 
             C 346 290, 334 298, 320 298 
             L 192 298 
             C 178 298, 166 290, 166 274 
             L 166 238 
             C 166 224, 174 216, 188 216 Z"
          fill="url(#carBodyGold)"
          stroke="url(#shieldGoldRim)"
          stroke-width="2.5" />

    <!-- Hood Accent Lines -->
    <path d="M 213 219 L 205 250" stroke="#9C6E1D" stroke-width="2" stroke-linecap="round" />
    <path d="M 299 219 L 307 250" stroke="#9C6E1D" stroke-width="2" stroke-linecap="round" />

    <!-- Left Headlight -->
    <circle cx="196" cy="250" r="11" fill="#FFFDE6" stroke="#C99427" stroke-width="2.5" filter="url(#headlightGlow)" />
    <circle cx="196" cy="250" r="6" fill="#FFFFFF" />

    <!-- Right Headlight -->
    <circle cx="316" cy="250" r="11" fill="#FFFDE6" stroke="#C99427" stroke-width="2.5" filter="url(#headlightGlow)" />
    <circle cx="316" cy="250" r="6" fill="#FFFFFF" />

    <!-- Center Emergency Red Siren Beacon -->
    <circle cx="256" cy="250" r="14" fill="url(#beaconGlow)" />
    <circle cx="256" cy="250" r="7.5" fill="#EF4444" stroke="#FFF4B8" stroke-width="2" />
    <circle cx="253" cy="247" r="2.2" fill="#FFFFFF" opacity="0.9" />

    <!-- Lower Grille Slot -->
    <rect x="220" y="264" width="72" height="18" rx="4" fill="#0B1019" stroke="#8C6218" stroke-width="2" />
    <line x1="226" y1="273" x2="286" y2="273" stroke="#C99427" stroke-width="2" />

    <!-- Bottom Bumper Trim -->
    <path d="M 182 293 L 330 293 C 333 293, 336 296, 333 300 L 328 304 C 325 307, 320 308, 314 308 L 198 308 C 192 308, 187 307, 184 304 L 179 300 C 176 296, 179 293, 182 293 Z" fill="url(#innerShieldGold)" />
  </g>

  <!-- LIVE TRAFFIC NPC Bottom Typography -->
  <text x="256" y="488"
        fill="url(#goldTextGrad)"
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Montserrat', sans-serif"
        font-size="30"
        font-weight="900"
        letter-spacing="6"
        text-anchor="middle"
        filter="url(#goldDropShadow)">LIVE TRAFFIC NPC</text>
</svg>
